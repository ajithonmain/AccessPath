name: GitHub release

# Fires whenever a vX.Y.Z tag is pushed (see RELEASING.md §5 — tagging is still a
# manual step, done after the npm publish, since npm publish itself needs interactive
# 2FA and can't be automated here). This just turns that one tag push into a GitHub
# release automatically, so it can't be quietly skipped the way it was for 0.1.2-0.1.5.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

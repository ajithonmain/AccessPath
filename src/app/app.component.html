<div class="demo-page">

  <header class="demo-toolbar">
    <h1>Accessibility Panel — Standalone Demo</h1>
    <div class="demo-toolbar-actions">
      <button type="button" (click)="toggleTheme()">{{ isDarkTheme ? 'Light theme' : 'Dark theme' }}</button>
      <button type="button" (click)="a11yPanel.open()">Open accessibility panel</button>
    </div>
  </header>

  <!-- This is the "widget"/app root the panel controls. Any element can be [container]. -->
  <div #demoRoot class="a11y-target demo-widget" [class.dark]="isDarkTheme">

    <div class="demo-msg bot">Hello! What are you craving today? 🍕</div>
    <div class="demo-msg user">Show me the menu</div>

    <div class="demo-card">
      <h3>Margherita Pizza</h3>
      <p>Classic tomato, mozzarella &amp; basil.</p>
      <div class="demo-card-row">
        <span class="demo-price">$12.99</span>
        <button type="button">Add to cart</button>
      </div>
    </div>

    <app-accessibility-panel #a11yPanel [container]="demoRoot" [isDarkTheme]="isDarkTheme"></app-accessibility-panel>
  </div>

</div>
